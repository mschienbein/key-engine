[package]
name = "key-engine"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false
autobins = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "key"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "wav", "aiff", "isomp4", "aac", "pcm"] }
